<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Drive — Soundtrack Lab</title>
    <link rel="stylesheet" href="/src/games/drive/styles/soundtrack-lab.css" />
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">Drive audio diagnostics</p><h1>Soundtrack Lab</h1></div>
        <a href="/drive/">Return to drive →</a>
      </header>

      <section class="transport panel">
        <div class="section-heading"><h2>Transport</h2><output id="status">Audio stopped</output></div>
        <div class="transport-actions">
          <button id="start-audio" type="button">Start soundtrack</button>
          <button id="pause-music" type="button" aria-pressed="false">Pause mix</button>
          <button id="record-mix" type="button" aria-pressed="false">Record mix</button>
          <label>Track <select id="soundtrack"><option value="night-signal">Night Signal · 01</option><option value="shadowline">Shadowline · 02</option><option value="bass-canyon">Bass Canyon · 03</option></select></label>
          <label>Speaker profile <select id="speaker-profile"><option value="full">Full range</option><option value="mobile">Mobile speaker</option></select></label>
        </div>
        <label class="bar-control">Bar <output id="bar-output">1 / 112</output><input id="bar" type="range" min="0" max="111" value="0" /></label>
      </section>

      <section class="panel">
        <div class="section-heading"><h2>Gameplay state</h2><span>Audition adaptive transitions</span></div>
        <div class="state-grid">
          <label>Vehicle trace <select id="vehicle-scenario"><option value="idle">Idle</option><option value="launch">Full-speed pull</option><option value="circle">Drift circle</option><option value="linked">Linked drifts</option></select></label>
          <label>Mix isolation <select id="mix-isolation"><option value="full">Complete mix</option><option value="music">Music only</option><option value="vehicle">Vehicle only</option></select></label>
          <label>Speed <output id="speed-output">35%</output><input id="speed" type="range" min="0" max="100" value="35" /></label>
          <label>Drift <output id="drift-output">0%</output><input id="drift" type="range" min="0" max="100" value="0" /></label>
          <label>Chase tier <select id="chase-tier"><option value="0">Cruise</option><option value="1">Tier 1</option><option value="2">Tier 2</option><option value="3">Tier 3</option></select></label>
        </div>
        <div class="cue-actions">
          <button type="button" data-cue="collision">Collision</button>
          <button type="button" data-cue="drift">Drift entry</button>
          <button type="button" data-cue="reinforcement">Reinforcement</button>
          <button type="button" data-cue="capture">Capture</button>
          <button type="button" data-cue="reset">Reset</button>
        </div>
      </section>

      <section class="panel stems-panel">
        <div class="section-heading"><h2>Logical stems</h2><button id="clear-solos" type="button">Clear solos</button></div>
        <div id="stems" class="stems"></div>
      </section>

      <section class="panel meters-panel">
        <div class="section-heading"><h2>Output</h2><output id="level">−∞ dBFS</output></div>
        <canvas id="spectrum" width="1200" height="360" aria-label="Complete mix spectrum"></canvas>
      </section>
    </main>
    <script type="module" src="/src/games/drive/labs/soundtrack-entry.ts"></script>
  </body>
</html>
