<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Drive—a tiny open driving game by Lukas Murdock." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#020405" />
    <title>Drive — A Real-Time Demo</title>
    <script>
      (() => {
        const parameters = new URLSearchParams(window.location.search);
        const legacyGameQuery = ["multiplayer", "mode", "map", "debug"].some((key) => parameters.has(key));
        const legacyDirectInvite = /^#(?:invite|response)=/u.test(window.location.hash);
        if (legacyGameQuery || legacyDirectInvite) {
          window.location.replace(`/drive/${window.location.search}${window.location.hash}`);
        }
      })();
    </script>
  </head>
  <body>
    <main class="demo" aria-label="Drive real-time introduction">
      <canvas id="demo-canvas" aria-hidden="true"></canvas>

      <nav class="demo-nav" aria-label="Demo controls">
        <a class="skip-link" href="/drive/">Skip to drive&nbsp; →</a>
      </nav>

      <section id="demo-title" class="demo-title" aria-labelledby="demo-heading">
        <p class="demo-kicker">Controllable excess</p>
        <h1 id="demo-heading">Drive</h1>
        <p class="demo-description">Cruise freely. Survive pursuit. Drive together.</p>
        <div class="demo-actions">
          <a class="demo-action" href="/drive/">Take a drive&nbsp; →</a>
          <button id="replay-demo" class="replay-button" type="button">Replay demo</button>
        </div>
        <p class="demo-credit">A real-time WebGL demo · Code / design</p>
      </section>

      <div id="demo-progress" class="demo-progress" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
